name: Refresh AI Landscape

on:
  schedule:
    - cron: "0 0 * * *"   # daily at midnight UTC
  workflow_dispatch:        # allow manual trigger from GitHub UI or CLI
    inputs:
      from:
        description: "Restart pipeline from this stage onward (research, generate, validate, build)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - research
          - generate
          - validate
          - build
      only:
        description: "Run exactly one stage (research, generate, validate, build)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - research
          - generate
          - validate
          - build

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline (research → generate → validate → build)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          if [ -n "${{ inputs.only }}" ]; then
            python pipeline.py --only=${{ inputs.only }}
          elif [ -n "${{ inputs.from }}" ]; then
            python pipeline.py --from=${{ inputs.from }}
          else
            python pipeline.py --force
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash
          git pull --rebase origin main
          git stash pop
          python build.py
          git add content/ docs/ validation_report.json
          git diff --staged --quiet || git commit -m "Auto-refresh: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
