[app]
name = "ai-landscape"
primary_region = "iad"

[build]
  [build.args]

[env]
  PORT = "8080"
  REFRESH_INTERVAL_HOURS = "24"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
