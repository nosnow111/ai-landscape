services:
  - type: web
    name: ai-landscape
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: REFRESH_INTERVAL_HOURS
        value: "24"

  - type: cron
    name: ai-landscape-refresh
    runtime: python
    buildCommand: pip install -r requirements.txt
    schedule: "0 0 * * *"
    startCommand: python generator.py
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
